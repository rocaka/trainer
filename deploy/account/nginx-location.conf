    # Trainer account API. Desktop-only: browser Origin requests are rejected
    # again by the application. The body limit matches the service contract.
    location ^~ /trainer-account/ {
        client_max_body_size 1m;
        limit_req zone=trainer_account burst=10 nodelay;
        rewrite ^/trainer-account/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
