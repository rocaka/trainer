name: Windows preview checks

# Only the explicitly authorized preview branch; never deploy or publish a release.
on:
  workflow_dispatch:
  push:
    branches: ["codex/windows-preview"]

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preview:
    name: Windows x64 test installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Check and build frontend
        working-directory: desktop
        run: npm run build

      - name: Install minimal Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Check native desktop shell (base configuration)
        working-directory: desktop/src-tauri
        run: cargo +stable check --locked

      - name: Install pinned backend build tools
        run: python -m pip install -r scripts/requirements-build.txt

      - name: Test platform paths and fail-closed submission capability
        env:
          PYTHONPATH: gateway
        run: python -m unittest discover -s gateway/tests -p "test_platform*.py" -v

      - name: Test credential validation and platform dispatch
        env:
          PYTHONPATH: gateway
        run: python -m unittest discover -s gateway/tests -p "test_system_credentials.py" -v

      - name: Test native Windows credential lifecycle with a disposable fake key
        run: python scripts/test-windows-credentials.py

      - name: Test isolated Gateway and owned-process shutdown
        timeout-minutes: 3
        run: python scripts/test-gateway-preview.py

      - name: Check backend resource allowlist
        run: python scripts/test-bundle-spec.py

      - name: Package Windows backend preview
        run: ./scripts/package-gateway.ps1

      - name: Smoke test frozen backend without Python subprocess
        timeout-minutes: 3
        run: python scripts/test-frozen-gateway.py

      - name: Build Windows test installer
        working-directory: desktop
        run: npm run tauri build -- --config src-tauri/windows-preview.conf.json

      # Only the compiled backend folder is uploaded. Never include test logs,
      # AppData, databases, generated courses, credential stores, or the workspace.
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trainer-windows-x64-installer-${{ github.run_id }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
